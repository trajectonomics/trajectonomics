name: Browser checks

# axe, the keyboard, the Language checks and the Lighthouse budget need a browser, so they run here
# and not in the shared check. The three callers in ci.yml, pr-title.yml and drift.yml stay one job
# with no steps, and trajectonomics/cicd stays unchanged (ADR 0004, site#6).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Accessibility, keyboard and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup the Node version package.json declares
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run the browser checks
        run: bun run test:browser

      - name: Run the mobile performance budget
        run: bun run test:performance

      - name: Upload the browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
