<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta
			name="description"
			content="Your financial plan, read from traj: net worth, cash flow, tax and chance of success."
		/>
		<!-- The Theme's --ds-color-background in both Themes (brand light.css and dark.css), pinned by scripts/app-html.test.ts. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- hosted:share -->
		<title>Dashboard · Trajectonomics</title>
		<!-- Sets the Theme before first paint: the stored choice, else the system's preference. -->
		<script>
			;(() => {
				let theme = "light"
				try {
					const stored = localStorage.getItem("traj.theme")
					if (stored === "light" || stored === "dark") theme = stored
					else if (matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark"
				} catch {
					// Storage or matchMedia is unavailable: the light Theme stands.
				}
				document.documentElement.dataset.theme = theme
			})()
		</script>
		%sveltekit.head%
	</head>
	<body class="flex min-h-screen flex-col bg-background font-sans text-foreground">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
