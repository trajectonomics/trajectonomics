name: Set up the workspace
description: Node, Bun and the locked dependencies, the same for every job in ci.yml.

runs:
  using: composite
  steps:
    # The root package.json engines is >=22.23.4 (the site needs it); "22" resolves to the newest 22.x.
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
