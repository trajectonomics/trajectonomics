name: Deploy

# Deploys the Site (worker "site", apps/site), the Docs Portal (worker "docs", apps/docs), the
# blog (worker "blog", apps/blog), the data Worker (worker "data", apps/data) and OpenJot's download
# and comparison Worker (worker "moojot-site", apps/openjot/site) to Cloudflare Workers from main.
# Every static site is served under one host: the Site at trajectonomics.com (with OpenJot's page at
# /openjot), the docs at /docs, the blog at /blog and the data site at /data. The Site owns the apex
# as a Custom Domain; the docs, blog and data Workers declare zone routes for their paths and keep
# their old subdomains for redirects. The OpenJot Worker declares zone routes for its short links,
# API, analytics proxy and comparison page under /openjot, and keeps openjot.trajectonomics.com and
# moojot.trajectonomics.com only to redirect (and to relay /ingest). There is no router.
# docs/runbooks/deploy.md has the setup.
#
#   push to main       -> deploys each app whose folder, or a shared input (the brand, the shared
#                         config, the lockfile), changed in the push. The Site also redeploys for its
#                         hosted Demo's inputs: the Dashboard, the command line and the core engine.
#                         The landing site has no build and imports nothing from the workspace, so
#                         only apps/openjot/site counts.
#   workflow_dispatch  -> deploys the app you pick, or all of them, from main.
#   schedule (daily)   -> redeploys the Site alone, so the GitHub star count in its header is read again
#                         (the Site's build refreshes the Star snapshot first; see "Refresh the star count").
#
# Safety switch: nothing runs until the repository variable DEPLOYS_ENABLED is true. It needs the
# secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit; D1: Edit for the data Worker) and
# CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # daily, off the hour
  workflow_dispatch:
    inputs:
      app:
        description: Which worker to deploy.
        type: choice
        options: [all, site, docs, blog, data, openjot]
        default: all

permissions:
  contents: read

jobs:
  plan:
    if: vars.DEPLOYS_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff of a push
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            apps='["site"]'
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Deploy from main, not $REF."
              exit 1
            fi
            case "$APP" in
            all) apps='["site","docs","blog","data","openjot"]' ;;
            *) apps="[\"$APP\"]" ;;
            esac
          else
            base=$BEFORE
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git rev-parse --verify --quiet "$SHA^" || git hash-object -t tree /dev/null)
            fi
            shared=(packages/brand tooling/config bun.lock package.json turbo.json)
            # The Site serves the Demo, which is built from the Dashboard, the command line and the
            # core engine, so a change there redeploys the Site even though its own folder is unchanged.
            site_shared=(apps/web apps/cli/src packages/core)
            apps='[]'
            for app in site docs blog data; do
              paths=("apps/$app" "${shared[@]}")
              if [ "$app" = "site" ]; then paths+=("${site_shared[@]}"); fi
              if [ -n "$(git diff --name-only "$base" "$SHA" -- "${paths[@]}")" ]; then
                apps=$(jq -c --arg app "$app" '. + [$app]' <<<"$apps")
              fi
            done
            # The landing site is static files plus worker.js, with no build and no workspace
            # imports, so only its own folder counts.
            if [ -n "$(git diff --name-only "$base" "$SHA" -- apps/openjot/site)" ]; then
              apps=$(jq -c '. + ["openjot"]' <<<"$apps")
            fi
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Deploying: $apps"

  deploy:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the docs read the newest cli-v tag for their release line

      - name: Stop when Cloudflare is not configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/runbooks/deploy.md)."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the workspace
        run: bun install --frozen-lockfile

      # The Site prints the repository's star count from a committed snapshot. A deploy reads the live
      # count into it before the build, without committing: the snapshot stays the fallback when GitHub
      # is unreachable, and the Site's own build is still the only thing that renders it.
      - name: Refresh the star count
        if: matrix.app == 'site'
        working-directory: apps/site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run stars:update || echo "::warning::Could not read the star count; deploying the committed snapshot."

      # turbo builds packages/brand first: every app imports its dist/current/.
      # The landing site is plain files and worker.js: it has nothing to build.
      - name: Build
        if: matrix.app != 'openjot'
        env:
          APP: ${{ matrix.app }}
        run: bunx turbo run build --filter="@trajectonomics/$APP" --concurrency=2

      - name: Apply D1 migrations
        if: matrix.app == 'data'
        working-directory: apps/data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply traj-data --remote

      - name: Deploy to Cloudflare Workers
        # The landing site is a subfolder of the app folder, and has no package.json of its own.
        working-directory: ${{ matrix.app == 'openjot' && 'apps/openjot/site' || format('apps/{0}', matrix.app) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
