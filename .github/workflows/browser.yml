name: Browser checks (site)

# axe, the keyboard, the Language checks and the Lighthouse budget need a browser, so they run here
# and not in the shared check. This is the port of apps/site/.github/workflows/browser.yml.
#
# Pull requests run it when they touch the site, the Demo's inputs (the Dashboard, the command line
# the Demo's snapshot reads, and the core engine), the brand package or the lockfile. Pushes to main
# run it too, so a merge that breaks the site is seen on main.
on:
  pull_request:
    paths:
      - "apps/site/**"
      - "apps/web/**"
      - "apps/cli/src/**"
      - "packages/core/**"
      - "packages/brand/**"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/web/**"
      - "apps/cli/src/**"
      - "packages/core/**"
      - "packages/brand/**"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Accessibility, keyboard and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the Turborepo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-packages-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-packages-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-web-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-packages-
            turbo-${{ runner.os }}-web-

      - name: Setup the workspace
        uses: ./.github/actions/setup

      # Build the Site (and its upstream brand and hosted Demo dependencies) once through turbo,
      # reusing the CI Turborepo cache instead of cold-building the hosted Demo twice.
      - name: Build the Site and its Demo assets
        run: bunx turbo run @trajectonomics/site#build --concurrency=4

      - name: Read the Playwright version
        id: playwright
        working-directory: apps/site
        run: echo "version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        working-directory: apps/site
        run: |
          if [ "${{ steps.browser.outputs.cache-hit }}" = true ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      - name: Run the browser checks
        working-directory: apps/site
        run: bunx playwright test

      - name: Run the mobile performance budget
        working-directory: apps/site
        run: bun scripts/performance.ts

      - name: Upload the browser report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/site/playwright-report/
          retention-days: 7
