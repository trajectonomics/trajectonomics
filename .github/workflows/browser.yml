name: Browser checks (site)

# axe, the keyboard, the Language checks and the Lighthouse budget need a browser, so they run here
# and not in the shared check. This is the port of apps/site/.github/workflows/browser.yml.
#
# Pull requests run it when they touch the site, the brand package or the lockfile. Pushes to main
# run it too, so a merge that breaks the site is seen on main.
on:
  pull_request:
    paths: ["apps/site/**", "packages/brand/**", "bun.lock"]
  push:
    branches: [main]
    paths: ["apps/site/**", "packages/brand/**", "bun.lock"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Accessibility, keyboard and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The site and docs import `@trajectonomics/brand`'s generated ./current folder, which `bun install`
      # does not create. Turbo builds it before a check; these jobs run outside turbo, so build it here.
      - name: Build the brand package
        working-directory: packages/brand
        run: bun run build

      - name: Read the Playwright version
        id: playwright
        working-directory: apps/site
        run: echo "version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        working-directory: apps/site
        run: bunx playwright install --with-deps chromium

      - name: Run the browser checks
        working-directory: apps/site
        run: bun run test:browser

      - name: Run the mobile performance budget
        working-directory: apps/site
        run: bun run test:performance

      - name: Upload the browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/site/playwright-report/
          retention-days: 7
