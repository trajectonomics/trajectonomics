name: Browser tests (docs)

# The docs' browser tests and their screenshots. This is the e2e job that apps/docs/.github/workflows/ci.yml
# ran beside its check job; the check job itself is now the root ci.yml.
on:
  pull_request:
    paths: ["apps/docs/**", "packages/brand/**", "bun.lock"]
  push:
    branches: [main]
    paths: ["apps/docs/**", "packages/brand/**", "bun.lock"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Docs browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The site and docs import `@trajectonomics/brand`'s generated ./current folder, which `bun install`
      # does not create. Turbo builds it before a check; these jobs run outside turbo, so build it here.
      - name: Read the Playwright version
        id: playwright
        working-directory: apps/docs
        run: echo "version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the brand package
        working-directory: packages/brand
        run: bun run build

      - name: Install Chromium
        working-directory: apps/docs
        run: bunx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: apps/docs
        run: bun run test:e2e

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: apps/docs/screenshots/
          retention-days: 7

      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/docs/playwright-report/
            apps/docs/test-results/
          retention-days: 7
