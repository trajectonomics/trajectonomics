name: openjot-release
# Pushing an `openjot-v*` tag builds a signed arm64 APK + AAB and publishes a
# GitHub Release. Running it by hand (Actions → openjot-release → Run workflow)
# is a dry run: it builds the same files and uploads them as workflow artifacts
# without publishing anything. See apps/openjot/docs/release/android.md.
#
# The release is created with `--latest=false`: `traj` releases keep the
# repository's "latest" badge, and the landing site finds `openjot-v*` itself.

on:
  push:
    tags:
      - "openjot-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openjot-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fixed asset names, so the landing site's Worker can find them in any release.
  APK_NAME: moojot-android-arm64.apk
  AAB_NAME: moojot-android-arm64.aab
  NDK_VERSION: 28.2.13676358
  BUILD_TOOLS: 36.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    # Holds the ANDROID_KEYSTORE_* secrets; only this workflow may use them.
    environment: openjot-release
    steps:
      # fetch-tags so the release notes can find the previous `openjot-v*` tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Release or dry run
        id: mode
        run: |
          app_version="$(node -p "require('./apps/openjot/package.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/openjot/src-tauri/Cargo.toml | head -n 1)"
          tauri_version="$(node -p "require('./apps/openjot/src-tauri/tauri.conf.json').version")"
          if [ "$app_version" != "$cargo_version" ] || [ "$app_version" != "$tauri_version" ]; then
            echo "Versions differ: package.json $app_version, Cargo.toml $cargo_version, tauri.conf.json $tauri_version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "openjot-v$app_version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match the app version openjot-v$app_version."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$app_version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-java@v4 # TODO pin SHA
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable # TODO pin SHA
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2 # TODO pin SHA
        with:
          workspaces: apps/openjot/src-tauri

      - name: Linux libraries for host tests
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/openjot
        run: bun run check

      - name: Unit tests
        working-directory: apps/openjot
        run: bun run test

      - name: Frontend build
        working-directory: apps/openjot
        run: bun run build

      - name: Rust tests
        working-directory: apps/openjot/src-tauri
        run: cargo test --lib

      # The default package list includes the retired `tools` package, which
      # sdkmanager can no longer find, so name only what we need.
      - uses: android-actions/setup-android@v3 # TODO pin SHA
        with:
          packages: platform-tools

      - name: Android SDK and NDK r28
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "Set the ANDROID_KEYSTORE_* secrets before tagging a release (apps/openjot/docs/release/android.md)."
              exit 1
            fi
            echo "::warning::No keystore secret: this dry run builds an UNSIGNED APK."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moojot-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/moojot-release.jks" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        working-directory: apps/openjot
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bun run tauri android build --apk --target aarch64
          bun run tauri android build --aab --target aarch64
          outputs=src-tauri/gen/android/app/build/outputs
          apk="$(find "$outputs/apk" -type f -name '*.apk' -path '*release*' | head -n 1)"
          aab="$(find "$outputs/bundle" -type f -name '*.aab' -path '*elease*' | head -n 1)"
          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "Release APK or AAB not found:"; find "$outputs" -type f
            exit 1
          fi
          mkdir -p ../../dist-release
          cp "$apk" "../../dist-release/$APK_NAME"
          cp "$aab" "../../dist-release/$AAB_NAME"

      # R8 once stripped what ML Kit and ONNX Runtime look up at runtime, so every
      # slip imported as 0 baht (#45). Debug builds skip R8, so check the real APK.
      - name: Check the APK keeps what OCR needs
        run: MOOJOT_APK="dist-release/$APK_NAME" node --test apps/openjot/tests/unit/release-apk.test.mjs

      - name: Check signature
        if: steps.mode.outputs.publish == 'true'
        run: |
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "dist-release/$APK_NAME" | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Check 16 KB ELF alignment
        run: |
          readelf="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          tmp="$(mktemp -d)"
          unzip -q "dist-release/$APK_NAME" -d "$tmp"
          bad=0
          while IFS= read -r -d '' so; do
            if ! "$readelf" -l "$so" | awk '/LOAD/ { align = strtonum($NF); if (align < 16384) bad = 1 } END { exit bad }'; then
              echo "Not 16 KB aligned: $so"
              bad=1
            fi
          done < <(find "$tmp/lib" -name '*.so' -print0)
          exit "$bad"

      - name: Checksums
        working-directory: dist-release
        run: sha256sum "$APK_NAME" "$AAB_NAME" > SHA256SUMS && cat SHA256SUMS

      - name: Upload dry-run build
        if: steps.mode.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moojot-${{ steps.mode.outputs.version }}-dry-run
          path: dist-release/
          retention-days: 7

      - name: Publish GitHub Release
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          MooJot ${VERSION} for Android (arm64). 🐷

          **Install:** download \`${APK_NAME}\` on your phone, open it, and allow installing from this source when Android asks. The app works offline, and your records stay on your phone.

          Check the download against \`SHA256SUMS\`. The \`.aab\` file is the Google Play upload.

          Privacy policy: ${repo_url}/blob/${GITHUB_REF_NAME}/apps/openjot/docs/privacy-policy.md · Terms: ${repo_url}/blob/${GITHUB_REF_NAME}/apps/openjot/docs/terms-of-service.md
          EOF
          # `--generate-notes` compares against the previous tag of any prefix in
          # this monorepo, so it would list every PR since a `cli-v*` tag: name
          # the previous `openjot-v*` tag instead, and drop the generated notes
          # altogether for the first openjot release.
          previous="$(git tag --list 'openjot-v*' --sort=-v:refname | awk -v current="$GITHUB_REF_NAME" '$0 != current { print; exit }')"
          if [ -n "$previous" ]; then
            notes_args=(--generate-notes --notes-start-tag "$previous")
          else
            notes_args=()
          fi
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --title "MooJot ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${notes_args[@]}" \
            --latest=false
