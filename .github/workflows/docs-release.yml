name: Docs release

# The Docs Portal documents the release its committed snapshot records (ADR 0015 in apps/docs/docs/adr).
# This job runs when a Release run finishes, weekly and by hand. While npm's `latest` is ahead of the
# snapshot it keeps one issue open, so the docs work starts the day a release ships. It opens no pull
# request and changes no file.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-release
  cancel-in-progress: false

jobs:
  docs-release:
    name: Docs release
    # A stable release is a dispatched Release run; the alpha runs on push are skipped.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, so contents is restated here.
    permissions:
      contents: read
      issues: write # find, file, update and close the docs-behind issue
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tags cli-v<version> are needed to list the commits between two releases.
          fetch-depth: 0

      - name: Compare the snapshot with npm
        id: compare
        run: |
          set -euo pipefail
          snapshot="$(jq -r .version apps/docs/src/generated/cli-release.json)"
          latest="$(npm view @trajectonomics/cli dist-tags.latest 2>/dev/null || true)"
          {
            echo "snapshot=$snapshot"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$latest" ]; then
            echo "::notice::Could not read npm's latest dist-tag for @trajectonomics/cli; nothing to compare."
            echo "state=unknown" >> "$GITHUB_OUTPUT"
          elif [ "$latest" != "$snapshot" ] && [ "$(printf '%s\n%s\n' "$snapshot" "$latest" | sort -V | tail -n 1)" = "$latest" ]; then
            echo "state=behind" >> "$GITHUB_OUTPUT"
          elif [ "$latest" = "$snapshot" ]; then
            echo "state=current" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The snapshot records @trajectonomics/cli@$snapshot, which is newer than npm's latest @trajectonomics/cli@$latest."
            echo "state=ahead" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the open issue
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --state open --limit 200 --json number,title \
            --jq '.[] | select(.title == "Docs behind the latest traj release") | .number' | head -n 1)"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: File the work
        if: steps.compare.outputs.state == 'behind'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.compare.outputs.snapshot }}
          LATEST: ${{ steps.compare.outputs.latest }}
          NUMBER: ${{ steps.find.outputs.number }}
        run: |
          set -euo pipefail
          {
            echo "npm's \`latest\` is \`@trajectonomics/cli@$LATEST\`; the Docs Portal's snapshot records \`$SNAPSHOT\`."
            echo
            echo "## Steps"
            echo
            echo '1. In `apps/docs`, run `bun run snapshot:cli` to record the published release in `src/generated/cli-release.json`.'
            echo '2. Run `bunx turbo run check --filter=@trajectonomics/docs --concurrency=2` and fix every page it reports.'
            echo '3. Read the commits and design records below, and update every page under `apps/docs/src/content/docs/cli/` whose behaviour changed; add a `bash exec` example where a command'"'"'s output is shown.'
            echo '4. Open one pull request; the `Docs examples` job runs every `bash exec` example against the new release.'
            echo
            echo "## Commits"
            echo
            if git rev-parse -q --verify "refs/tags/cli-v$SNAPSHOT" >/dev/null \
              && git rev-parse -q --verify "refs/tags/cli-v$LATEST" >/dev/null; then
              echo '```text'
              git log --oneline --no-merges "cli-v$SNAPSHOT..cli-v$LATEST" -- apps/cli packages/core
              echo '```'
            else
              echo "One of the two tags is missing; compare the releases on GitHub."
            fi
            echo
            echo "## Design records added"
            echo
            if git rev-parse -q --verify "refs/tags/cli-v$SNAPSHOT" >/dev/null \
              && git rev-parse -q --verify "refs/tags/cli-v$LATEST" >/dev/null; then
              added="$(git diff --name-only --diff-filter=A "cli-v$SNAPSHOT" "cli-v$LATEST" -- apps/cli/docs/adr)"
              if [ -n "$added" ]; then
                printf '%s\n' "$added" | sed 's/^/- /'
              else
                echo "None."
              fi
            else
              echo "One of the two tags is missing; compare the releases on GitHub."
            fi
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Docs behind the latest traj release" --label documentation \
              --label needs-triage --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Close the issue once the docs are current
        if: steps.compare.outputs.state == 'current' && steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.find.outputs.number }}
        run: |
          set -euo pipefail
          gh issue close "$NUMBER" --comment "The Docs Portal's snapshot records the latest release again."
