name: Release docs

# The README and the help notes name the release that ships what they describe (ADR-0034).
# A pull request fails only on the drift it introduces; the weekly run adds the freshness rule,
# so a marker is removed once its release has shipped instead of rotting. The check reads the
# published release's own schema, so it is a workflow job and never part of `bun run check`,
# which stays offline and deterministic (AGENTS.md rule 4).
#
# The freshness rule also runs right after each stable release (release.yml's workflow_dispatch run):
# a marker naming the release that just shipped is what the rule exists to catch.
on:
  pull_request:
    branches: [main]
    paths:
      - apps/cli/**
      - .github/workflows/release-docs.yml
  schedule:
    - cron: "0 6 * * 1" # Mondays, with the tooling drift job
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/cli

jobs:
  check:
    # A release run counts only when it published a stable release and succeeded.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the workspace
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Build the engine the CLI imports
        # The check runs the CLI's source, which resolves @trajectonomics/core/* through core's dist/.
        working-directory: .
        run: bunx turbo run build --filter="@trajectonomics/cli^..." --concurrency=2
      - name: Read the latest published release's own command list
        # npm serves a version a minute or three before its release has assets (ADR-0023), so
        # this waits for the release rather than failing a pull request on that window.
        shell: bash
        env:
          PACKAGE: "@trajectonomics/cli"
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          wait=5
          while true; do
            latest=$(npm view "$PACKAGE" dist-tags.latest || true)
            if [ -n "$latest" ] && npx --yes "$PACKAGE@$latest" schema --json >released.json 2>npx.log; then
              echo "RELEASE_DOCS_LATEST=$latest" >>"$GITHUB_ENV"
              echo "the latest release is $latest"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat npx.log || true
              echo "::error::npm did not serve $PACKAGE within ten minutes."
              exit 1
            fi
            echo "npm is not serving $PACKAGE yet; waiting ${wait}s."
            sleep "$wait"
            wait=$((wait * 2))
            [ "$wait" -le 60 ] || wait=60
          done
      - name: Check the README and the help notes against that release
        env:
          RELEASE_DOCS_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'freshness' || 'pull-request' }}
        run: bun run src/release-docs-cli.ts
