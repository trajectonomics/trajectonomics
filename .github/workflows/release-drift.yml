name: Release drift (site)

# The Site prints the release its committed Release snapshot records, and only `bun run release:update`
# moves it. This weekly run compares that snapshot with npm's `latest` and with the GitHub release of
# the same tag, then reports a snapshot that has fallen behind as one issue, updated in place and
# closed again when the snapshot is current ([ADR 0019](../../apps/site/docs/adr/0019-the-site-prints-the-release-from-a-committed-snapshot.md)).
#
# It opens no branch, merges nothing and touches no host: a stale snapshot is a report for the owner
# and the next Factory pass, never a red build with no cause. A `latest` whose release does not exist
# yet is reported as waiting, not as drift, so the npm-first window of a publish files no issue.
#
# GitHub turns a schedule off after 60 days without repository activity, and a disabled workflow
# cannot be dispatched; turn it back on with `gh workflow enable release-drift.yml`.
# This is the port of apps/site/.github/workflows/release-drift.yml.
on:
  schedule:
    - cron: "0 6 * * 2" # Tuesdays, the day after the tooling drift
  workflow_dispatch:

permissions:
  contents: read # read the committed snapshot and the script that judges it

concurrency:
  group: release-drift-${{ github.repository }}
  cancel-in-progress: false

jobs:
  drift:
    name: Release drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions replace the workflow's, so contents is restated here.
    permissions:
      contents: read # read the committed snapshot and the script that judges it
      issues: write # open, update and close the release-drift issue
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No `bun install`: the check reads two feeds and the committed snapshot, so it needs no package.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Report a snapshot behind the published release
        working-directory: apps/site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:drift
